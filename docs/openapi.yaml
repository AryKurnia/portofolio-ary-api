openapi: 3.1.0
info:
  title: Ary Portofolio API
  description: |
    API untuk Portofolio Ary Kurnia.

    Dokumen ini hanya memuat endpoint yang **sudah diimplementasikan**. Endpoint yang
    direncanakan (profile, projects, timeline, dsb.) ada di `docs/design/API.md` dan
    `docs/AUDIT.md` §5, dan ditambahkan ke sini saat dibangun.

    Kesesuaian dokumen ini dengan kode dijaga oleh `test/contract/openapi.test.js`:
    setiap route harus terdokumentasi, dan setiap respons harus cocok dengan skemanya.

    **Konvensi**
    - Respons sukses: `{ "data": ... }`, list berpaginasi: `{ "data": [...], "meta": {...} }`.
    - Respons error: `{ "error": { "code", "message", "details"? } }`.
    - Nama field: `snake_case`. Pesan error: bahasa Inggris.
  version: 1.0.0
  contact:
    name: Ary Kurnia
    email: aryk922@gmail.com
servers:
  - url: https://arykurnia.com/api/v1
    description: Production server
  - url: http://localhost:3000/api/v1
    description: Development server

tags:
  - name: Health
  - name: Auth
  - name: Skills
  - name: Social Media

security: []

paths:
  # ============================================================
  # HEALTH
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Status kesehatan API
      description: Melakukan ping ke database. Detail error tidak pernah dikembalikan.
      responses:
        '200':
          description: Semua komponen sehat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data: { status: ok, database: ok }
        '503':
          description: Database tidak bisa dijangkau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data: { status: error, database: unreachable }

  # ============================================================
  # AUTH
  # ============================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Login admin
      description: Menghasilkan JWT (HS256) untuk endpoint yang membutuhkan `bearerAuth`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: supersecret
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [access_token, expires_in]
                    properties:
                      access_token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      expires_in:
                        type: integer
                        description: Masa berlaku token dalam detik
                        example: 3600
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'

  # ============================================================
  # SKILLS
  # ============================================================
  /skills:
    get:
      tags: [Skills]
      summary: List skill (berpaginasi)
      description: Saat ini mengembalikan semua skill, termasuk `enabled = false`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Daftar skill
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Skills]
      summary: Tambah skill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreateInput'
      responses:
        '201':
          $ref: '#/components/responses/SkillOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /skills/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Skills]
      summary: Detail skill
      responses:
        '200':
          $ref: '#/components/responses/SkillOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Skills]
      summary: Ganti data skill
      description: Semua field wajib dikirim. `logo_url` tidak bisa diubah lewat endpoint ini.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/SkillOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Skills]
      summary: Hapus skill
      description: Data dihapus lebih dulu; logo di storage dihapus setelahnya secara best-effort.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Skill berhasil dihapus
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /skills/{id}/logo:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Skills]
      summary: Upload/ganti logo skill
      description: |
        File disimpan ke object storage (MinIO) dan `logo_url` diperbarui.
        Tipe file saat ini diperiksa dari header `Content-Type` bagian multipart
        (pemeriksaan isi file direncanakan di M4).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: PNG, JPEG, WebP, atau SVG — maksimal 2 MB
            encoding:
              logo:
                contentType: image/png, image/jpeg, image/webp, image/svg+xml
      responses:
        '200':
          $ref: '#/components/responses/SkillOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  # ============================================================
  # SOCIAL MEDIA
  # ============================================================
  /profile/social-media:
    get:
      tags: [Social Media]
      summary: List semua social media
      description: Saat ini mengembalikan semua platform, termasuk `enabled = false`.
      responses:
        '200':
          description: Daftar social media
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SocialMedia'

  /profile/social-media/{platform}:
    parameters:
      - $ref: '#/components/parameters/PlatformParam'
    get:
      tags: [Social Media]
      summary: Detail social media per platform
      responses:
        '200':
          $ref: '#/components/responses/SocialMediaOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Social Media]
      summary: Update sebagian data social media
      description: |
        Hanya field yang dikirim yang diubah; field yang tidak dikirim mempertahankan nilai lama.
        `platform` tidak bisa diubah.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialMediaUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/SocialMediaOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    PlatformParam:
      name: platform
      in: path
      required: true
      description: Nama platform sebagai kunci unik
      schema:
        type: string
        enum: [github, linkedin, instagram, twitter, facebook]
      example: github
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    SkillOk:
      description: Data skill
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Skill'
    SocialMediaOk:
      description: Data social media
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/SocialMedia'
    ValidationError:
      description: Input tidak valid (`VALIDATION_ERROR`); `details` berisi pesan per field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Some fields are invalid.
              details:
                - { field: email, message: email must be a valid email }
    Unauthorized:
      description: Token tidak ada, kedaluwarsa, atau tidak valid (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: UNAUTHORIZED, message: Missing or invalid access token. }
    InvalidCredentials:
      description: Email atau password salah (`INVALID_CREDENTIALS`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: INVALID_CREDENTIALS, message: Invalid email or password. }
    NotFound:
      description: Resource tidak ditemukan (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: NOT_FOUND, message: Skill with id 99 was not found. }
    PayloadTooLarge:
      description: File lebih dari 2 MB (`PAYLOAD_TOO_LARGE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: PAYLOAD_TOO_LARGE, message: File must be 2 MB or smaller. }
    UnsupportedMediaType:
      description: Tipe file tidak diizinkan (`UNSUPPORTED_MEDIA_TYPE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: UNSUPPORTED_MEDIA_TYPE, message: Use PNG, JPG, WebP or SVG. }

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                additionalProperties: false
                properties:
                  field:
                    type: string
                  message:
                    type: string

    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, database]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [ok, error]
            database:
              type: string
              enum: [ok, unreachable]

    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42

    Skill:
      type: object
      required: [id, name, logo_url, description, enabled, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 100
          example: Node.js
        logo_url:
          type: [string, 'null']
          example: https://minio.example.com/portfolio/skills/6f1c...png
        description:
          type: [string, 'null']
          example: Runtime JavaScript di sisi server.
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SkillCreateInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: [string, 'null']
        enabled:
          type: boolean
          default: true

    SkillUpdateInput:
      type: object
      required: [name, description, enabled]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: [string, 'null']
        enabled:
          type: boolean

    SocialMedia:
      type: object
      required: [id, platform, url, username, enabled]
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 1
        platform:
          type: string
          example: github
        url:
          type: string
          format: uri
          example: https://github.com/example
        username:
          type: string
          example: example
        enabled:
          type: boolean
          example: true

    SocialMediaUpdateInput:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        username:
          type: string
          maxLength: 100
        enabled:
          type: boolean
