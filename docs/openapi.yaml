openapi: 3.1.0
info:
  title: Ary Portofolio API
  description: API documentation untuk Portofolio Ary Kurnia
  version: 1.0.0
  contact:
    name: Ary Kurnia
    email: aryk922@gmail.com
servers:
  - url: https://arykurnia.com/api/v1
    description: Production server
  - url: http://localhost:3000/api/v1
    description: Development server

tags:
  - name: Auth
  - name: Profile
  - name: Skills
  - name: Projects
  - name: Experience

security: []

paths:
  # ============================================================
  # AUTH
  # ============================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Login admin
      description: Login untuk mendapatkan JWT token, digunakan untuk mengakses endpoint write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: aryk922@gmail.com
                password:
                  type: string
                  format: password
                  example: "supersecret"
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  expiresIn:
                    type: integer
                    example: 3600
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ============================================================
  # PROFILE
  # ============================================================
  /profile:
    get:
      tags: [Profile]
      summary: Get personal information
      description: Retrieve data profil inti (tanpa skills/projects/experience).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
    put:
      tags: [Profile]
      summary: Update personal information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Profile berhasil diupdate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/photo:
    post:
      tags: [Profile]
      summary: Upload/ganti foto profile
      description: Upload file foto profil, disimpan ke object storage (MinIO). Field `photoUrl` pada profile akan diupdate otomatis.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: File gambar (png, jpg, webp — maks 2MB)
      responses:
        '200':
          description: Foto profile berhasil diupload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/social-media:
    get:
      tags: [Profile]
      summary: List semua social media
      responses:
        '200':
          description: Daftar social media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialMediaLink'

  /profile/social-media/{platform}:
    parameters:
      - $ref: '#/components/parameters/PlatformParam'
    get:
      tags: [Profile]
      summary: Detail social media per platform
      responses:
        '200':
          description: Detail social media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialMediaLink'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Profile]
      summary: Update social media per platform
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialMediaInput'
      responses:
        '200':
          description: Social media berhasil diupdate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialMediaLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ============================================================
  # SKILLS
  # ============================================================
  /skills:
    get:
      tags: [Skills]
      summary: List semua skill
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Daftar skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags: [Skills]
      summary: Tambah skill baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillInput'
      responses:
        '201':
          description: Skill berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /skills/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Skills]
      summary: Detail skill
      responses:
        '200':
          description: Detail skill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Skills]
      summary: Update skill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillInput'
      responses:
        '200':
          description: Skill berhasil diupdate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Skills]
      summary: Hapus skill
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Skill berhasil dihapus
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /skills/{id}/logo:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Skills]
      summary: Upload/ganti logo skill
      description: Upload file gambar logo, disimpan ke object storage (MinIO). Field `logoUrl` pada skill akan diupdate otomatis.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: File gambar (png, jpg, webp, svg — maks 2MB)
      responses:
        '200':
          description: Logo berhasil diupload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

