# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    PlatformParam:
      name: platform
      in: path
      required: true
      description: Nama platform sebagai unique key (bukan integer id)
      schema:
        type: string
        enum: [linkedin, github, facebook, instagram, twitter]
      example: linkedin
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 10

  responses:
    Unauthorized:
      description: Token tidak valid atau tidak disertakan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Payload tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Skill dengan id tersebut tidak ditemukan."

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42

    SocialMediaLink:
      type: object
      properties:
        platform:
          type: string
          example: linkedin
        url:
          type: string
          example: https://www.linkedin.com/in/arykurnia
        username:
          type: string
          example: arykurnia
        enabled:
          type: boolean
          default: true

    SocialMediaInput:
      type: object
      required: [url, username]
      properties:
        url:
          type: string
          example: https://www.linkedin.com/in/arykurnia
        username:
          type: string
          example: arykurnia
        enabled:
          type: boolean
          default: true

    Profile:
      type: object
      properties:
        name:
          type: string
          example: Ary Kurnia
        email:
          type: string
          example: aryk922@gmail.com
        tagline:
          type: string
          example: "a Web and Back-End developer."
        about:
          type: string
          example: "Saya adalah lulusan S1 Teknik Informatika yang memiliki ketertarikan mendalam pada rekayasa perangkat lunak, khususnya di sisi backend dan infrastruktur."
        photoUrl:
          type: string
          example: https://minio.arykurnia.my.id/portfolio/profile/photo.jpg
        socialMedia:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaLink'

    ProfileInput:
      type: object
      required: [name, email, tagline, about]
      properties:
        name:
          type: string
        email:
          type: string
        tagline:
          type: string
        about:
          type: string

    Skill:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Node.js
        logoUrl:
          type: string
          example: https://nodejs.org/static/images/logo.svg
        description:
          type: string
          example: "Node.js adalah runtime JavaScript yang berjalan di server."
        enabled:
          type: boolean
          default: true

    SkillInput:
      type: object
      required: [name, logoUrl]
      properties:
        name:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          default: true

    Project:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Portofolio Ary Kurnia
        description:
          type: string
          example: "Sebuah situs portofolio yang menampilkan berbagai proyek dan keahlian."
        thumbnailUrl:
          type: string
          example: https://arykurnia.com/thumbnail.jpg
        url:
          type: string
          example: https://arykurnia.com
        enabled:
          type: boolean
          default: true

    ProjectInput:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: string
        url:
          type: string
        enabled:
          type: boolean
          default: true

    Education:
      type: object
      properties:
        id:
          type: integer
          example: 1
        institution:
          type: string
          example: Universitas XYZ
        degree:
          type: string
          example: Sarjana Teknik Informatika
        fieldOfStudy:
          type: string
          example: Teknik Informatika
        startDate:
          type: string
          format: date
          example: 2015-09-01
        endDate:
          type: string
          format: date
          example: 2019-06-30
        description:
          type: string

    EducationInput:
      type: object
      required: [institution, degree, fieldOfStudy, startDate]
      properties:
        institution:
          type: string
        degree:
          type: string
        fieldOfStudy:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        description:
          type: string

    Job:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company:
          type: string
          example: PT ABC
        position:
          type: string
          example: Backend Developer
        startDate:
          type: string
          format: date
          example: 2019-07-01
        endDate:
          type: string
          format: date
          example: 2021-12-31
        description:
          type: string

    JobInput:
      type: object
      required: [company, position, startDate]
      properties:
        company:
          type: string
        position:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        description:
          type: string