openapi: 3.1.0
info:
  title: Ary Portofolio API
  description: |
    API untuk Portofolio Ary Kurnia.

    Dokumen ini hanya memuat endpoint yang **sudah diimplementasikan**. Endpoint yang
    direncanakan (profile, projects, timeline, dsb.) ada di `docs/design/API.md` dan
    `docs/AUDIT.md` §5, dan ditambahkan ke sini saat dibangun.

    Kesesuaian dokumen ini dengan kode dijaga oleh `test/contract/openapi.test.js`:
    setiap route harus terdokumentasi, dan setiap respons harus cocok dengan skemanya.

    **Konvensi**
    - Respons sukses: `{ "data": ... }`, list berpaginasi: `{ "data": [...], "meta": {...} }`.
    - Respons error: `{ "error": { "code", "message", "details"? } }`.
    - Nama field: `snake_case`. Pesan error: bahasa Inggris.
  version: 1.0.0
  contact:
    name: Ary Kurnia
    email: aryk922@gmail.com
servers:
  - url: https://arykurnia.com/api/v1
    description: Production server
  - url: http://localhost:3000/api/v1
    description: Development server

tags:
  - name: Public
    description: |
      Endpoint halaman portofolio: tanpa auth, hanya data yang terbit.
      Semua respons 200 membawa `Cache-Control: public, max-age=60, stale-while-revalidate=300`
      dan `ETag`; kirim `If-None-Match` untuk mendapat `304 Not Modified` tanpa body.
  - name: Health
  - name: Auth
  - name: Skills
  - name: Social Media
  - name: Profile
  - name: Timeline
  - name: Skill Categories
  - name: Projects
  - name: Uploads

security: []

paths:
  # ============================================================
  # PUBLIC (halaman portofolio)
  # ============================================================
  /portfolio:
    get:
      tags: [Public]
      summary: Semua data halaman utama dalam satu request (untuk SSR/ISR)
      description: |
        `projects.items` berisi maksimal 6 project terbit; `has_more` memunculkan tombol
        "See all projects". Skill per kategori ditambahkan setelah skill dikaitkan ke kategori.
      responses:
        '200':
          description: Data portofolio
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [profile, projects, timeline, social_links]
                    additionalProperties: false
                    properties:
                      profile: { $ref: '#/components/schemas/PublicProfile' }
                      projects:
                        type: object
                        required: [items, total, has_more]
                        additionalProperties: false
                        properties:
                          items:
                            type: array
                            maxItems: 6
                            items: { $ref: '#/components/schemas/PublicProject' }
                          total: { type: integer }
                          has_more: { type: boolean }
                      timeline: { $ref: '#/components/schemas/PublicTimeline' }
                      social_links:
                        type: array
                        items: { $ref: '#/components/schemas/PublicSocialLink' }
        '404':
          $ref: '#/components/responses/NotFound'

  /profile:
    get:
      tags: [Public]
      summary: Profil (hero, about, intro project, email kontak)
      responses:
        '200':
          description: Profil
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicProfile' }
        '404':
          $ref: '#/components/responses/NotFound'

  /projects:
    get:
      tags: [Public]
      summary: Project terbit untuk Projects Archive (berpaginasi)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        '200':
          description: Daftar project terbit
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicProject' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400':
          $ref: '#/components/responses/ValidationError'

  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Public]
      summary: Detail project terbit
      description: Project yang belum terbit dibalas 404 seperti tidak ada.
      responses:
        '200':
          description: Project
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicProject' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /timeline:
    get:
      tags: [Public]
      summary: Education & Work/Organization, terurut dan berlabel
      description: |
        Struktur selalu organisasi → posisi; frontend memilih Timeline Item (1 posisi) atau
        Timeline Group (≥ 2 posisi). Organisasi tanpa posisi tidak ditampilkan.
      responses:
        '200':
          description: Timeline
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicTimeline' }

  /social-links:
    get:
      tags: [Public]
      summary: Tautan media sosial yang aktif
      responses:
        '200':
          description: Tautan sosial
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicSocialLink' }

  # ============================================================
  # HEALTH
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Status kesehatan API
      description: Melakukan ping ke database. Detail error tidak pernah dikembalikan.
      responses:
        '200':
          description: Semua komponen sehat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data: { status: ok, database: ok }
        '503':
          description: Database tidak bisa dijangkau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data: { status: error, database: unreachable }

  # ============================================================
  # AUTH (admin)
  # ============================================================
  /admin/auth/login:
    post:
      tags: [Auth]
      summary: Login admin
      description: |
        Mengembalikan access token (JWT HS256) di body dan memasang refresh token di cookie
        `refresh_token` (`HttpOnly; SameSite=Strict; Path=/api/v1/admin/auth`, `Secure` di
        production). Refresh token tidak pernah muncul di body.
        Pembatasan percobaan login dilakukan di reverse proxy (bukan di aplikasi).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                  maxLength: 50
                  example: admin
                password:
                  type: string
                  format: password
                  maxLength: 128
                  example: supersecret
      responses:
        '200':
          description: Login berhasil
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AccessToken'
                      - type: object
                        required: [admin]
                        properties:
                          admin:
                            $ref: '#/components/schemas/Admin'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'

  /admin/auth/refresh:
    post:
      tags: [Auth]
      summary: Tukar refresh token dengan access token baru
      description: |
        Membaca cookie `refresh_token`, merotasinya (token lama langsung dicabut), dan memasang
        cookie baru. Memakai token yang sudah dicabut dianggap pencurian: semua sesi admin itu
        ikut dicabut.
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookieParam'
      responses:
        '200':
          description: Access token baru
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Mencabut refresh token dari cookie dan menghapus cookie. Idempoten.
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookieParam'
      responses:
        '204':
          description: Logout berhasil (juga bila tidak ada sesi)
          headers:
            Set-Cookie:
              description: '`refresh_token=; Max-Age=0; ...` (menghapus cookie)'
              schema:
                type: string

  /admin/auth/me:
    get:
      tags: [Auth]
      summary: Data admin yang sedang login
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data admin
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Admin'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # SKILLS
  # ============================================================
  /skills:
    get:
      tags: [Skills]
      summary: List skill (berpaginasi)
      description: Saat ini mengembalikan semua skill, termasuk `enabled = false`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Daftar skill
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Skills]
      summary: Tambah skill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreateInput'
      responses:
        '201':
          $ref: '#/components/responses/SkillOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /skills/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Skills]
      summary: Detail skill
      responses:
        '200':
          $ref: '#/components/responses/SkillOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Skills]
      summary: Ganti data skill
      description: Semua field wajib dikirim. `logo_url` tidak bisa diubah lewat endpoint ini.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/SkillOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Skills]
      summary: Hapus skill
      description: Data dihapus lebih dulu; logo di storage dihapus setelahnya secara best-effort.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Skill berhasil dihapus
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /skills/{id}/logo:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Skills]
      summary: Upload/ganti logo skill
      description: |
        File disimpan ke object storage (MinIO) dan `logo_url` diperbarui.
        Tipe file saat ini diperiksa dari header `Content-Type` bagian multipart
        (pemeriksaan isi file direncanakan di M4).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: PNG, JPEG, WebP, atau SVG — maksimal 2 MB
            encoding:
              logo:
                contentType: image/png, image/jpeg, image/webp, image/svg+xml
      responses:
        '200':
          $ref: '#/components/responses/SkillOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  # ============================================================
  # SOCIAL MEDIA
  # ============================================================
  /profile/social-media:
    get:
      tags: [Social Media]
      summary: List semua social media
      description: Saat ini mengembalikan semua platform, termasuk `enabled = false`.
      responses:
        '200':
          description: Daftar social media
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SocialMedia'

  /profile/social-media/{platform}:
    parameters:
      - $ref: '#/components/parameters/PlatformParam'
    get:
      tags: [Social Media]
      summary: Detail social media per platform
      responses:
        '200':
          $ref: '#/components/responses/SocialMediaOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Social Media]
      summary: Update sebagian data social media
      description: |
        Hanya field yang dikirim yang diubah; field yang tidak dikirim mempertahankan nilai lama.
        `platform` tidak bisa diubah.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialMediaUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/SocialMediaOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # PROFILE (admin)
  # ============================================================
  /admin/profile:
    get:
      tags: [Profile]
      summary: Profil pemilik portofolio (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProfileOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Profile]
      summary: Ubah sebagian profil
      description: |
        Tombol "Save changes" per section mengirim field section itu saja (minimal satu field).
        Teks di-trim dan tidak boleh mengandung HTML.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/ProfileOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # TIMELINE (admin): organizations & positions
  # ============================================================
  /admin/organizations:
    get:
      tags: [Timeline]
      summary: Daftar organisasi beserta posisinya
      description: Diurutkan sesuai aturan timeline (API.md §6), termasuk yang belum lengkap.
      security:
        - bearerAuth: []
      parameters:
        - name: group
          in: query
          schema:
            $ref: '#/components/schemas/OrganizationGroup'
      responses:
        '200':
          description: Daftar organisasi
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Timeline]
      summary: Tambah organisasi
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateInput'
      responses:
        '201':
          $ref: '#/components/responses/OrganizationOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/organizations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Timeline]
      summary: Ubah nama/lokasi organisasi
      description: '`group` tidak bisa diubah karena posisi terikat aturan tipe per grup.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/OrganizationOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Timeline]
      summary: Hapus organisasi beserta semua posisinya
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Organisasi dan posisinya terhapus
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/organizations/{id}/positions/reorder:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Timeline]
      summary: Simpan urutan posisi hasil drag & drop
      description: '`ids` harus memuat semua posisi organisasi tepat satu kali.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderInput'
      responses:
        '204':
          description: Urutan tersimpan
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/positions:
    post:
      tags: [Timeline]
      summary: Tambah posisi (panel "Timeline item")
      description: |
        Kirim `organization_id`, ATAU `organization_name` + `group` (organisasi dibuat bila belum ada).
        Aturan bisnis (API.md §3) dilaporkan per field dengan status 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionCreateInput'
      responses:
        '201':
          $ref: '#/components/responses/PositionOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/positions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Timeline]
      summary: Ubah sebagian posisi
      description: Aturan bisnis divalidasi terhadap gabungan data lama + perubahan.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/PositionOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Timeline]
      summary: Hapus posisi
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Posisi terhapus
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # SKILL CATEGORIES (admin)
  # ============================================================
  /admin/skill-categories:
    get:
      tags: [Skill Categories]
      summary: Daftar kategori skill (urut sort_order)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Skill Categories]
      summary: Tambah kategori (ditaruh paling akhir)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCategoryInput'
      responses:
        '201':
          $ref: '#/components/responses/SkillCategoryOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/skill-categories/reorder:
    patch:
      tags: [Skill Categories]
      summary: Simpan urutan kategori hasil drag & drop
      description: '`ids` harus memuat semua kategori tepat satu kali.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderInput'
      responses:
        '204':
          description: Urutan tersimpan
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/skill-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Skill Categories]
      summary: Ganti nama kategori
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCategoryInput'
      responses:
        '200':
          $ref: '#/components/responses/SkillCategoryOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Skill Categories]
      summary: Hapus kategori
      description: Penolakan 409 bila kategori masih berisi skill ditambahkan saat skill dikaitkan ke kategori.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Kategori terhapus
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # PROJECTS (admin)
  # ============================================================
  /admin/projects:
    get:
      tags: [Projects]
      summary: Daftar project (termasuk yang belum terbit)
      description: Urut sort_order ASC, lalu created_at DESC.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        '200':
          description: Daftar project
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Tambah project
      description: |
        `show_button` default mengikuti ada/tidaknya `link_url`; `is_published` default true.
        Project terbit wajib punya `image_id` hasil upload `kind=project_image`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateInput'
      responses:
        '201':
          $ref: '#/components/responses/ProjectOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/projects/reorder:
    patch:
      tags: [Projects]
      summary: Simpan urutan project hasil drag & drop
      description: '`ids` harus memuat semua project tepat satu kali.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderInput'
      responses:
        '204':
          description: Urutan tersimpan
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Projects]
      summary: Detail project
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProjectOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Ubah sebagian project
      description: Aturan divalidasi terhadap gabungan data lama + perubahan.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/ProjectOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      summary: Hapus project
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Project terhapus
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # UPLOADS (admin)
  # ============================================================
  /admin/uploads:
    post:
      tags: [Uploads]
      summary: Unggah gambar (langkah 1 dari 2 — lalu kirim id-nya di form resource)
      description: |
        Jenis file ditentukan dari ISI file, bukan dari header `Content-Type` klien.
        - `project_image`, `profile_photo`: PNG/JPEG/WebP → WebP (400/800/1200 atau 400/800 px),
          orientasi EXIF diterapkan, metadata dibuang.
        - `skill_logo`: PNG/JPEG/WebP → WebP 128/256 px, atau SVG yang disanitasi (tetap vektor).
        Maksimal 2 MB dan 36 megapiksel. Objek disajikan dengan `Cache-Control: immutable`.
        Upload yang tidak dipakai dihapus oleh `npm run media:cleanup` setelah 24 jam.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [project_image, skill_logo, profile_photo]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Gambar tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Image'
                      - type: object
                        required: [kind]
                        properties:
                          kind: { type: string, enum: [project_image, skill_logo, profile_photo] }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /admin/uploads/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    delete:
      tags: [Uploads]
      summary: Hapus gambar yang tidak dipakai
      description: Ditolak 409 bila gambar masih dipakai project atau profil.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Gambar terhapus
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    ETag:
      description: Hash isi respons; kirim balik lewat If-None-Match untuk 304
      schema: { type: string }
    PublicCacheControl:
      description: 'public, max-age=60, stale-while-revalidate=300'
      schema: { type: string }
    RefreshTokenCookie:
      description: '`refresh_token=<token>; Max-Age=604800; Path=/api/v1/admin/auth; HttpOnly; SameSite=Strict` (+ `Secure` di production)'
      schema:
        type: string

  parameters:
    RefreshTokenCookieParam:
      name: refresh_token
      in: cookie
      required: false
      description: Diisi otomatis oleh browser dari login/refresh sebelumnya
      schema:
        type: string
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    PlatformParam:
      name: platform
      in: path
      required: true
      description: Nama platform sebagai kunci unik
      schema:
        type: string
        enum: [github, linkedin, instagram, twitter, facebook]
      example: github
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    SkillCategoryOk:
      description: Data kategori skill
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/SkillCategory'
    ProjectOk:
      description: Data project
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Project'
    ProfileOk:
      description: Data profil
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Profile'
    OrganizationOk:
      description: Data organisasi
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Organization'
    PositionOk:
      description: Data posisi
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Position'
    Conflict:
      description: Bentrok dengan data yang ada (`CONFLICT`), mis. nama duplikat
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: An organization with this name already exists in this group.
              details:
                - { field: name, message: Name is already used in this group. }
    SkillOk:
      description: Data skill
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Skill'
    SocialMediaOk:
      description: Data social media
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/SocialMedia'
    ValidationError:
      description: Input tidak valid (`VALIDATION_ERROR`); `details` berisi pesan per field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Some fields are invalid.
              details:
                - { field: email, message: email must be a valid email }
    Unauthorized:
      description: Access token atau refresh token tidak ada, kedaluwarsa, atau tidak valid (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: UNAUTHORIZED, message: Missing or invalid access token. }
    InvalidCredentials:
      description: Username atau password salah (`INVALID_CREDENTIALS`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: INVALID_CREDENTIALS, message: Invalid username or password. }
    NotFound:
      description: Resource tidak ditemukan (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: NOT_FOUND, message: Skill with id 99 was not found. }
    PayloadTooLarge:
      description: File lebih dari 2 MB (`PAYLOAD_TOO_LARGE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: PAYLOAD_TOO_LARGE, message: File must be 2 MB or smaller. }
    UnsupportedMediaType:
      description: Tipe file tidak diizinkan (`UNSUPPORTED_MEDIA_TYPE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: UNSUPPORTED_MEDIA_TYPE, message: Use PNG, JPG, WebP or SVG. }

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                additionalProperties: false
                properties:
                  field:
                    type: string
                  message:
                    type: string

    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, database]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [ok, error]
            database:
              type: string
              enum: [ok, unreachable]

    AccessToken:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          description: Masa berlaku access token dalam detik
          example: 900

    Admin:
      type: object
      required: [id, username]
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: admin

    Profile:
      type: object
      required: [greeting, tagline, about, project_intro, email, photo, updated_at]
      additionalProperties: false
      properties:
        greeting: { type: string, maxLength: 80, example: "Hi, I'm Ary Kurnia" }
        tagline: { type: string, maxLength: 120, example: a Web and Back-End developer }
        about: { type: string, maxLength: 1000 }
        project_intro: { type: [string, 'null'], maxLength: 200 }
        email: { type: string, format: email }
        photo: { $ref: '#/components/schemas/NullableImage' }
        updated_at: { type: string, format: date-time }

    ProfileUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        greeting: { type: string, maxLength: 80 }
        tagline: { type: string, maxLength: 120 }
        about: { type: string, maxLength: 1000 }
        project_intro: { type: [string, 'null'], maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        photo_id:
          type: [integer, 'null']
          minimum: 1
          description: id hasil upload kind=profile_photo; null menghapus foto

    OrganizationGroup:
      type: string
      enum: [education, work_organization]

    PositionType:
      type: string
      enum: [full_time, part_time, freelance, contract, internship, self_employed,
             member, board, committee, volunteer, education]

    YearMonth:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: 2024-01

    Organization:
      type: object
      required: [id, name, group, location, sort_order, is_current, positions]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string, example: UKM MAPALA Universitas Handayani Makassar }
        group: { $ref: '#/components/schemas/OrganizationGroup' }
        location: { type: [string, 'null'] }
        sort_order: { type: [integer, 'null'] }
        is_current:
          type: boolean
          description: true bila salah satu posisinya masih berjalan
        positions:
          type: array
          items: { $ref: '#/components/schemas/Position' }

    Position:
      type: object
      required: [id, organization_id, title, type, type_label, event_name, start_date, end_date,
                 is_current, period_label, description, sort_order]
      additionalProperties: false
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        title: { type: string, example: Ketua Panitia }
        type: { $ref: '#/components/schemas/PositionType' }
        type_label: { type: string, example: Committee }
        event_name: { type: [string, 'null'], example: Diksar }
        start_date: { $ref: '#/components/schemas/YearMonth' }
        end_date:
          oneOf:
            - $ref: '#/components/schemas/YearMonth'
            - type: 'null'
        is_current: { type: boolean }
        period_label:
          type: string
          description: '"YYYY – YYYY", "YYYY – Present", atau "YYYY" (en dash)'
          example: 2023 – 2025
        description: { type: [string, 'null'] }
        sort_order: { type: [integer, 'null'] }

    OrganizationCreateInput:
      type: object
      required: [name, group]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        group: { $ref: '#/components/schemas/OrganizationGroup' }
        location: { type: [string, 'null'], maxLength: 80 }

    OrganizationUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        location: { type: [string, 'null'], maxLength: 80 }

    PositionFields:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        type: { $ref: '#/components/schemas/PositionType' }
        event_name:
          type: [string, 'null']
          maxLength: 120
          description: Wajib bila type = committee, selain itu harus null
        start_date:
          allOf:
            - $ref: '#/components/schemas/YearMonth'
          description: Paling jauh satu tahun ke depan
        end_date:
          oneOf:
            - $ref: '#/components/schemas/YearMonth'
            - type: 'null'
          description: Harus null bila is_current; tidak boleh sebelum start_date
        is_current: { type: boolean, default: false }
        description: { type: [string, 'null'], maxLength: 500 }

    PositionCreateInput:
      description: |
        Tepat salah satu: `organization_id`, atau `organization_name` + `group`.
        Organisasi grup education hanya menerima type education, dan sebaliknya.
      allOf:
        - $ref: '#/components/schemas/PositionFields'
        - type: object
          required: [title, type, start_date]
          properties:
            organization_id: { type: integer, minimum: 1 }
            organization_name: { type: string, maxLength: 120 }
            group: { $ref: '#/components/schemas/OrganizationGroup' }
          oneOf:
            - required: [organization_id]
            - required: [organization_name, group]

    PositionUpdateInput:
      allOf:
        - $ref: '#/components/schemas/PositionFields'
        - type: object
          minProperties: 1

    ReorderInput:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }

    SkillCategory:
      type: object
      required: [id, name, sort_order]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 40, example: Backend }
        sort_order: { type: integer }

    SkillCategoryInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }

    Project:
      type: object
      required: [id, title, description, image_id, image, link_url, show_button, is_published, sort_order,
                 created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 60, example: FitAI Coach }
        description: { type: string, maxLength: 300 }
        image_id: { type: [integer, 'null'] }
        image: { $ref: '#/components/schemas/NullableImage' }
        link_url: { type: [string, 'null'], format: uri }
        show_button: { type: boolean }
        is_published: { type: boolean }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectFields:
      type: object
      properties:
        title: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        image_id:
          type: [integer, 'null']
          minimum: 1
          description: id hasil upload kind=project_image
        link_url:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          description: Hanya https
        show_button:
          type: boolean
          description: true mensyaratkan link_url
        is_published:
          type: boolean
          description: true mensyaratkan image_id

    ProjectCreateInput:
      allOf:
        - $ref: '#/components/schemas/ProjectFields'
        - type: object
          required: [title, description]

    ProjectUpdateInput:
      allOf:
        - $ref: '#/components/schemas/ProjectFields'
        - type: object
          minProperties: 1

    PublicProfile:
      type: object
      required: [greeting, tagline, about, project_intro, email, photo]
      additionalProperties: false
      properties:
        greeting: { type: string }
        tagline: { type: string }
        about: { type: string }
        project_intro: { type: [string, 'null'] }
        email: { type: string, format: email }
        photo: { $ref: '#/components/schemas/NullableImage' }

    PublicProject:
      type: object
      required: [id, title, description, image, link_url, show_button]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        image: { $ref: '#/components/schemas/NullableImage' }
        link_url: { type: [string, 'null'], format: uri }
        show_button: { type: boolean }

    PublicPosition:
      type: object
      required: [id, title, type, type_label, event_name, start_date, end_date, is_current,
                 period_label, description]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string }
        type: { $ref: '#/components/schemas/PositionType' }
        type_label: { type: string, example: Full-time }
        event_name: { type: [string, 'null'] }
        start_date: { $ref: '#/components/schemas/YearMonth' }
        end_date:
          oneOf:
            - $ref: '#/components/schemas/YearMonth'
            - type: 'null'
        is_current: { type: boolean }
        period_label: { type: string, example: 2025 – Present }
        description: { type: [string, 'null'] }

    PublicOrganization:
      type: object
      required: [id, name, location, is_current, positions]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        location: { type: [string, 'null'] }
        is_current: { type: boolean }
        positions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PublicPosition' }

    PublicTimeline:
      type: object
      required: [education, work_organization]
      additionalProperties: false
      properties:
        education:
          type: array
          items: { $ref: '#/components/schemas/PublicOrganization' }
        work_organization:
          type: array
          items: { $ref: '#/components/schemas/PublicOrganization' }

    PublicSocialLink:
      type: object
      required: [platform, label, url]
      additionalProperties: false
      properties:
        platform: { type: string, example: github }
        label: { type: string, example: GitHub }
        url: { type: string, format: uri }

    Image:
      type: object
      required: [id, url, width, height, mime, variants]
      properties:
        id: { type: integer, description: Dipakai sebagai image_id / photo_id }
        url: { type: string, format: uri, description: Versi utama (terbesar) }
        width: { type: [integer, 'null'], description: Lebar gambar asli }
        height: { type: [integer, 'null'] }
        mime: { type: string, enum: [image/webp, image/svg+xml] }
        variants:
          type: object
          description: 'Lebar (px) → URL, untuk srcset. SVG hanya punya "original".'
          additionalProperties: { type: string, format: uri }
          example:
            '400': https://minio.example.com/portfolio/project_image/6f1c-400.webp
            '800': https://minio.example.com/portfolio/project_image/6f1c-800.webp

    NullableImage:
      oneOf:
        - $ref: '#/components/schemas/Image'
        - type: 'null'

    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42

    Skill:
      type: object
      required: [id, name, logo_url, description, enabled, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 100
          example: Node.js
        logo_url:
          type: [string, 'null']
