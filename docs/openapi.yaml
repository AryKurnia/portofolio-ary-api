  /experience/jobs:
    get:
      tags: [Experience]
      summary: List riwayat pekerjaan
      responses:
        '200':
          description: Daftar pekerjaan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
    post:
      tags: [Experience]
      summary: Tambah riwayat pekerjaan
      security:
        - bearerAuth: []
