        '201':
          description: Project berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Projects]
      summary: Detail project
      responses:
        '200':
          description: Detail project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      summary: Update project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project berhasil diupdate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Projects]
      summary: Hapus project
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Project berhasil dihapus
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Projects]
      summary: Upload/ganti thumbnail project
      description: Upload file gambar thumbnail, disimpan ke object storage (MinIO). Field `thumbnailUrl` pada project akan diupdate otomatis.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [thumbnail]
              properties:
                thumbnail:
                  type: string
                  format: binary
                  description: File gambar (png, jpg, webp — maks 2MB)
      responses:
        '200':
          description: Thumbnail berhasil diupload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ============================================================
  # EXPERIENCE - EDUCATIONS
  # ============================================================
  /experience/educations:
